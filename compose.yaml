services:
  reporter:
    build: ./services/reporter
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      OPERATION_PATH: /usage
      UPSTREAM_URL: http://meter:8081/readings
    depends_on:
      meter:
        condition: service_healthy
  meter:
    build: ./services/meter
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8081/health', timeout=1).close()"]
      interval: 1s
      timeout: 2s
      retries: 20
    environment:
      HOST: 0.0.0.0
      PORT: "8081"
      OPERATION_PATH: /readings
      DB_PATH: /data/demo.sqlite3
    volumes:
      - service-data:/data

volumes:
  service-data:
